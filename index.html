<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-icon">✓</span>Spectre</div><div><div class="navgroup-title">Workspace</div><button class="navitem active" data-view="today"><span class="navicon">◷</span>Today <span class="count" id="todayCount"></span></button><button class="navitem" data-view="upcoming"><span class="navicon">▦</span>Upcoming</button><button class="navitem" data-view="calendar"><span class="navicon">▦</span>Calendar</button><button class="navitem" data-view="all"><span class="navicon">☷</span>All tasks <span class="count" id="allCount"></span></button><button class="navitem" data-view="completed"><span class="navicon">✓</span>Completed</button></div><div><div class="navgroup-title">Folders <button class="mini" id="addFolder" style="float:right;margin-top:-8px">＋</button></div><div id="folderNav"></div></div><div id="tagsGroup"><div class="navgroup-title">Tags</div><div id="tagNav"></div></div><div class="sidebar-bottom">A little progress each day adds up.<br><strong>You've got this. 🌱</strong></div></aside><div class="sidebar-scrim" id="scrim"></div>

<script>
(()=>{'use strict';const KEY='daymark.v1';const localISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const todayISO=()=>localISO(new Date());const dateLabel=(iso,opts={month:'short',day:'numeric'})=>{if(!iso)return '';const d=new Date(iso);return Number.isNaN(+d)?'':new Intl.DateTimeFormat(undefined,opts).format(d)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,10);let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.tasks))state={tasks:[{id:uid(),title:'Plan the week ahead',description:'Take a few minutes to set intentions for the days ahead.',createdAt:Date.now(),due:'',start:'',priority:'Medium',status:'To Do',folder:'Personal',tags:['Planning'],subtasks:[],attachments:[],notes:'',recurrence:'',reminder:'',notified:false,order:0},{id:uid(),title:'Take a proper lunch break',description:'Step away from the screen and get some fresh air.',createdAt:Date.now(),due:'',start:'',priority:'Low',status:'In Progress',folder:'Personal',tags:['Wellbeing'],subtasks:[],attachments:[],notes:'',recurrence:'',reminder:'',notified:false,order:1}],folders:['Personal','Work'],notes:[{id:uid(),title:'A note to self',text:'You don’t have to do everything today. Just the next small thing.',createdAt:Date.now()}],view:'today',folderView:'',tagView:'',sort:'manual',reminded:{}};if(!Array.isArray(state.folders))state.folders=['Personal','Work'];if(!Array.isArray(state.notes))state.notes=[];if(!Array.isArray(state.tasks))state.tasks=[];if(!Array.isArray(state.tags))state.tags=[];if(!state.username)state.username='User'+Math.floor(1000+Math.random()*9000);localStorage.setItem(KEY,JSON.stringify(state));let view=state.view||'today',folderView='',tagView='',draftSub=[],draftFiles=[],searchTerm='',dragId=null,calendarMonth=new Date(new Date().getFullYear(),new Date().getMon function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function allTags(){return [...new Set([...(state.tags||[]),...state.tasks.flatMap(t=>t.tags||[])])].sort((a,b)=>a.localeCompare(b))}function refreshSelects(){const tags=allTags();$('tagsGroup').hidden=!tags.length;$('tagFilter').innerHTML='<option value="">Any tag</option>'+tags.map(x=>`<option>${esc(x)}</option>`).join('');$('projectFilter').innerHTML='<option value="">Any folder</option>'+state.folders.map(x=>`<option>${esc(x)}</option>`).join('');$('folderInput').innerHTML='<option value="">No folder</option>'+state.folders.map(x=>`<option>${esc(x)}</option>`).join('');$('tagNav').innerHTML=tags.map((t,i)=>`<button class="tagline" data-tag="${esc(t)}"><span class="dot" style="background:${['#be8d58','#7892b2','#a284ae','#66a08b','#cc8b79','#9b9c62'][i%6]}"></span>${esc(t)}</button>`).join('');$('tagNav').querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{tagView=b.dataset.tag;view='tag';folderView='';render()});renderFolders()}
function renderFolders(){const n=$('folderNav');n.innerHTML=state.folders.map(f=>`<div class="folder-row"><button class="navitem ${folderView===f?'active':''}" data-folder="${esc(f)}"><span class="navicon">▱</span>${esc(f)}<span class="count">${state.tasks.filter(t=>t.folder===f&&t.status!=='Completed').length}</span></button><button class="mini" data-delfolder="${esc(f)}" title="Remove folder">×</button></div>`).join('')||'<button class="folder-empty-action" data-create-folder>＋ Create folder</button>';n.querySelector('[data-create-folder]')?.addEventListener('click',openFolderModal);n.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folderView=b.dataset.folder;view='folder';tagView='';render()});n.querySelectorAll('[data-delfolder]').forEach(b=>b.onclick=()=>{const f=b.dataset.delfolder;if(confirm(`Remove the “${f}” folder? Its tasks will be kept without a folder.`)){state.folders=state.folders.filter(x=>x!==f);state.tasks.forEach(t=>{if(t.folder===f)t.folder=''});folderView='';save();render()}})}
function visibleTasks(){let arr=[...state.tasks];if(view==='today')arr=arr.filter(t=>t.status!=='Completed'&&(!t.due||t.due.slice(0,10)<=todayISO()));if(view==='upcoming')arr=arr.filter(t=>t.status!=='Completed'&&t.due&&t.due.slice(0,10)>=todayISO());if(view==='calendar')arr=arr.filter(t=>t.status!=='Completed'&&t.due&&t.due.slice(0,7)===`${calendarMonth.getFullYear()}-${String(calendarMonth.getMonth()+1).padStart(2,'0')}`);if(view==='completed')arr=arr.filter(t=>t.status==='Completed');if(view==='folder')arr=arr.filter(t=>t.folder===folderView);if(view==='tag')arr=arr.filter(t=>(t.tags||[]).includes(tagView));if(view==='all'||view==='folder'||view==='tag'){}if(view!=='completed'&&view!=='today'&&view!=='upcoming'){}const st=$('statusFilter').value,pr=$('priorityFilter').value,tg=$('tagFilter').value,fo=$('projectFilter').value,df=$('dateFilter').value;if(st)arr=arr.filter(t=>t.status===st);if(pr)arr=arr.filter(t=>t.priority===pr);if(tg)arr=arr.filter(t=>(t.tags||[]).includes(tg));if(fo)arr=arr.filter(t=>t.folder===fo);if(df==='overdue')arr=arr.filter(t=>t.due&&t.due.slice(0,10)<todayISO()&&t.status!=='Completed');if(df==='today')arr=arr.filter(t=>t.due&&t.due.slice(0,10)===todayISO());if(df==='week'){const end=new Date();end.setDate(end.getDate()+7);arr=arr.filter(t=>t.due&&new Date(t.due)<=end)}if(df==='none')arr=arr.filter(t=>!t.due);if(searchTerm)arr=arr.filter(t=>t.title.toLowerCase().includes(searchTerm.toLowerCase()));const sort=$('sortSelect').value;if(sort==='due')arr.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));if(sort==='priority')arr.sort((a,b)=>['High','Medium','Low'].indexOf(a.priority)-['High','Medium','Low'].indexOf(b.priority));if(sort==='created')arr.sort((a,b)=>b.createdAt-a.createdAt);if(sort==='alpha')arr.sort((a,b)=>a.title.localeCompare(b.title));if(sort==='manual')arr.sort((a,b)=>(a.order??0)-(b.order??0));return arr}
function renderTask(t){const due=t.due?new Date(t.due):null;const late=due&&due<new Date()&&t.status!=='Completed';const subs=t.subtasks||[],done=subs.filter(s=>s.done).length;return `<article class="task ${t.status==='Completed'?'completed':''}" draggable="true" data-task="${t.id}"><input class="check" type="checkbox" ${t.status==='Completed'?'checked':''} aria-label="Mark complete"><div class="task-body"><div class="task-title">${esc(t.title)}</div>${t.description?`<div class="task-desc">${esc(t.description)}</div>`:''}<div class="task-meta"><span class="pill priority-${(t.priority||'medium').toLowerCase()}">${esc(t.priority||'Medium')}</span>${t.status==='In Progress'?'<span class="pill status">In Progress</span>':''}${(t.tags||[]).slice(0,2).map(x=>`<span class="pill tag">${esc(x)}</span>`).join('')}${t.folder?`<span class="pill">▱ ${esc(t.folder)}</span>`:''}${due?`<span class="due ${late?'overdue':''}">◷ ${dateLabel(t.due)}${t.due.includes('T')?' · '+dateLabel(t.due,{hour:'numeric',minute:'2-digit'}):''}</span>`:''}${subs.length?`<span class="subcount">☷ ${done}/${subs.length}</span>`:''}${(t.attachments||[]).length?`<span class="subcount">⌁ ${t.attachments.length}</span>`:''}${t.recurrence?`<span class="subcount">↻ ${esc(t.recurrence)}</span>`:''}</div></div><button class="task-quick" title="Edit task">···</button></article>`}
function render(){refreshSelects();document.querySelector('.app').classList.toggle('calendar-mode',view==='calendar');$('calendarTasksPane').hidden=view!=='calendar';const d=new Date();$('todayDate').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(d);$('allCount').textContent=state.tasks.filter(t=>t.status!=='Completed').length||'';$('todayCount').textContent=state.tasks.filter(t=>t.status!=='Completed'&&(!t.due||t.due.slice(0,10)<=todayISO())).length||'';const titles={today:['Today, ','well spent.'],calendar:['Your ','calendar.'],upcoming:['Looking ','ahead.'],all:['All your ','tasks.'],completed:['Look what ','you did.'],folder:[folderView+' ','folder.'],tag:['Tagged ','#'+tagView+'.']};let [a,b]=titles[view]||titles.today;$('viewTitle').innerHTML=esc(a)+'<span>'+esc(b)+'</span>';$('listHeading').textContent=view==='today'?'Your tasks':view==='upcoming'?'Coming up':view==='completed'?'Completed':view==='folder'?folderView:view==='tag'?'#'+tagView:'All tasks';const open=state.tasks.filter(t=>t.status!=='Completed').length,done=state.tasks.filter(t=>t.status==='Completed').length,pct=state.tasks.length?Math.round(done/state.tasks.length*100):0;$('progressTitle').textContent=pct===100?'Beautifully done':open?`${open} ${open===1?'task':'tasks'} in your hands`:'A fresh start';$('progressSub').textContent=done?`${done} ${done===1?'task':'tasks'} completed — keep going.`:'Small steps make a meaningful day.';$('progressFill').style.width=pct+'%';$('progressNum').textContent=pct+'%';const arr=visibleTasks();$('usernameBtn').textContent=state.username;$('calendarView').hidden=view!=='calendar';el.taskList.style.display=view==='calendar'?'none':'flex';if(view==='calendar')renderCalendar();el.taskList.innerHTML=arr.length?arr.map(renderTask).join(''):`<div class="empty"><strong>${searchTerm?'No matching tasks':view==='folder'?'This folder is empty':view==='tag'?'No tasks use this tag yet':view==='completed'?'No completed tasks function toggleTask(id,checked){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.status=checked?'Completed':'To Do';if(checked&&t.recurrence){const next={...t,id:uid(),createdAt:Date.now(),status:'To Do',notified:false,subtasks:(t.subtasks||[]).map(s=>({...s,done:false})),due:advance(t.due,t.recurrence),order:Math.max(0,...state.tasks.map(x=>x.order||0))+1};state.tasks.push(next);toast(`${t.recurrence} task scheduled again`)}save();render()}function advance(value,period){if(!value)return '';const d=new Date(value);if(period==='Daily')d.setDate(d.getDate()+1);if(period==='Weekly')d.setDate(d.getDate()+7);if(period==='Monthly')d.setMonth(d.getMonth()+1);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}${value.includes('T')?'T'+p(d.getHours())+':'+p(d.getMinutes()):''}`}
function openTask(id,defaults={}){const t=state.tasks.find(x=>x.id===id);draftSub=t?(t.subtasks||[]).map(s=>({...s})):[];draftFiles=t?(t.attachments||[]).map(x=>({...x})):[];$('modalTitle').textContent=t?'Edit task':'New task';$('taskId').value=t?.id||'';$('titleInput').value=t?.title||'';$('descriptionInput').value=t?.description||'';$('startInput').value=t?.start||defaults.start||todayISO();$('dueInput').value=t?.due||defaults.due||new Date(Date.now()+3600000).toISOString().slice(0,16);$('optionalBody').classList.toggle('expanded',!!(t&&(t.description||t.folder||t.tags?.length||t.subtasks?.length||t.attachments?.length||t.notes||t.recurrence||t.reminder)));$('optionalToggle').onclick=()=>$('optionalBody').classList.toggle('expanded');$('priorityInput').value=t?.priority||'Medium';$('statusInput').value=t?.status||'To Do';$('folderInput').value=t?.folder||defaults.folder||'';$('tagsInput').value=(t?.tags||[]).join(', ')||(defaults.tag||'');$('recurrenceInput').value=t?.recurrence||'';$('reminderInput').value=t?.reminder||'';$('taskNotesInput').value=t?.notes||'';$('deleteTaskBtn').style.visibility=t?'visible':'hidden';$('attachmentInput').value='';renderDraft();el.modal.classList.add('open');setTimeout(()=>$('titleInput').focus(),80)}function renderDraft(){$('checklistItems').innerHTML=draftSub.map((s,i)=>`<span class="check-chip">${s.done?'✓ ':''}${esc(s.text)} <button type="button" data-sub="${i}" style="border:0;background:none;color:#a66">×</button></span>`).join('');$('checklistItems').querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{draftSub.splice(+b.dataset.sub,1);renderDraft()});$('attachmentItems').innerHTML=draftFiles.map((f,i)=>`<span class="check-chip">⌁ ${esc(f.name)} <button type="button" data-file="${i}" style="border:0;background:none;color:#a66">×</button></span>`).join('');$('attachmentItems').querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{draftFiles.splice(+b.dataset.file,1);renderDraft()})}
$('addSubtask').onclick=()=>{const v=$('subtaskInput').value.trim();if(v){draftSub.push({text:v,done:false});$('subtaskInput').value='';renderDraft()}};$('subtaskInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('addSubtask').click()}};$('attachmentInput').onchange=e=>{draftFiles.push(...[...e.target.files].map(f=>({name:f.name,size:f.size,type:f.type})));renderDraft()};$('closeModal').onclick=()=>el.modal.classList.remove('open');el.modal.onclick=e=>{if(e.target===el.modal)el.modal.classList.remove('open')};$('taskForm').onsubmit=e=>{e.preventDefault();const id=$('taskId').value;const old=state.tasks.find(x=>x.id===id);const t={id:id||uid(),title:$('titleInput').value.trim(),description:$('descriptionInput').value.trim(),start:$('startInput').value,due:$('dueInput').value,priority:$('priorityInput').value,status:$('statusInput').value,folder:$('folderInput').value,tags:[...new Set($('tagsInput').value.split(',').map(x=>x.trim()).filter(Boolean))],recurrence:$('recurrenceInput').value,reminder:$('reminderInput').value,subtasks:draftSub,attachments:draftFiles,notes:$('taskNotesInput').value.trim(),createdAt:old?.createdAt||Date.now(),order:old?.order??state.tasks.length,notified:old?.due===$('dueInput').value?old?.notified:false};if(old)Object.assign(old,t);else state.tasks.push(t);save();el.modal.classList.remove('open');render();toast(old?'Task updated':'Task added')};$('deleteTaskBtn').onclick=()=>{const id=$('taskId').value;state.tasks=state.tasks.filter(t=>t.id!==id);save();el.modal.classList.remove('open');render();toast('Task deleted')};$('topAddBtn').onclick=()=>openTask();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;folderView='';tagView='';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render();closeSidebar()});el.filters.forEach(f=>f.onchange=render);$('sortSelect').onchange=()=>{state.sort=$('sortSelect').value;render()};$('addFolder').onclick=()=>openFolderMod ,'<div class="notes-empty">Your thoughts, reminders, and little ideas go here.</div>');return}state.notes.forEach(n=>{const card=document.createElement('div');card.className='note-card';card.innerHTML=`<div class="note-top"><strong style="font-size:12px;color:#565d54">${esc(n.title||'Quick note')}</strong><span><span class="note-date">${dateLabel(new Date(n.createdAt).toISOString())}</span> <button class="note-del" title="Delete note">×</button></span></div><div class="note-text">${esc(n.text)}</div>`;card.querySelector('.note-del').onclick=()=>{state.notes=state.notes.filter(x=>x.id!==n.id);save();renderNotes()};target.append(card)})};make($('mobileNotesContent'))}

function renderCalendar(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),week=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let html='<div class="calendar-header"><button class="iconbtn" id="calPrev">‹</button><strong>'+new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(calendarMonth)+'</strong><button class="iconbtn" id="calNext">›</button><button class="calendar-today" id="calToday">Today</button></div><div class="calendar-grid">'+week.map(w=>'<div class="cal-weekday">'+w+'</div>').join('');for(let i=0;i<42;i++){let num=i-offset+1,dt=new Date(y,m,num),inMonth=num>0&&num<=days,iso=localISO(dt),dayTasks=state.tasks.filter(t=>t.due&&t.due.slice(0,10)===iso),display=inMonth?num:(num<1?prev+num:num-days);html+='<div class="cal-day '+(inMonth?'':'outside')+' '+(iso===selectedDay?'selected':'')+' '+(iso===todayISO()?'is-today':'')+'" data-day="'+iso+'" tabindex="0" role="button"><span>'+display+'</span>'+dayTasks.slice(0,3).map(t=>'<button type="button" class="cal-task" data-task-id="'+t.id+'" data-date="'+dateLabel(t.due,{year:'numeric',month:'long',day:'numeric'})+'" title="'+esc(t.title)+' · '+dateLabel(t.due,{year:'numeric',month:'long',day:'numeric'})+'">'+esc(t.title)+'</button>').join('')+(dayTasks.length>3?'<span class="cal-more">+'+(dayTasks.length-3)+' more</span>':'')+'</div>'}html+='</div><div class="calendar-hover-card" id="calendarHoverCard" hidden></div>'; $('calendarView').innerHTML=html;const dayItems=state.tasks.filter(t=>t.due&&t.due.slice(0,10)===selectedDay);$('calendarTasksPane').innerHTML='<div class="right-head"><h3>'+dateLabel(selectedDay,{weekday:'long',month:'long',day:'numeric'})+'</h3><span class="notes-header">'+dayItems.length+' '+(dayItems.length===1?'task':'tasks')+'</span></div><div class="agenda-list">'+(dayItems.length?dayItems.map(renderTask).join(''):'<div class="empty"><strong>No tasks this day</strong><span>Add a task for this date to see it here.</span><div class="empty-actions"><button class="save-task" data-create-day-task>Create task</button></div></div>')+'</div>';$('calendarTasksPane').querySelector('[data-create-day-task]')?.addEventListener('click',()=>openTask('',{start:selectedDay,due:selectedDay+'T09:00'}));document.querySelectorAll('#calendarTasksPane .task').forEach(card=>{card.querySelector('.check').onchange=e=>toggleTask(card.dataset.task,e.target.checked);card.querySelector('.task-quick').onclick=()=>openTask(card.dataset.task);card.onclick=e=>{if(e.target.closest('button,input'))return;showTaskDetail(card.dataset.task)}});$('calPrev').onclick=()=>{calendarMonth=new Date(y,m-1,1);selectedDay=localISO(calendarMonth);render()};$('calNext').onclick=()=>{calendarMonth=new Date(y,m+1,1);selectedDay=localISO(calendarMonth);render()};$('calToday').onclick=()=>{calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);selectedDay=todayISO();render()};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;renderCalendar()});document.querySelectorAll('.cal-task').forEach(b=>{b.onclick=e=>{e.stopPropagation();showTaskDetail(b.dataset.taskId)};b.onmouseenter=e=>{const card=$('calendarHoverCard');card.innerHTML='<strong>'+esc(state.tasks.find(t=>t.id===b.dataset.taskId)?.title||'Task')+'</strong><span>'+esc(b.dataset.date)+'</span>';card.hidden=false;card.style.left=Math.min(e.clientX+12,window.innerWidth-245)+'px';card.style.top=Math.min(e.clientY+12,window.innerHeight-80)+'px'};b.onmousemove=e=>{const card=$('calendarHoverCard');card.style.left=Math.min(e.clientX+12,window.innerWidth-245)+'px';card.style.top=Math.min(e.clientY+12,window.innerHeight-80)+'px'};b.onmouseleave=()=>$('calendarHoverCard').hidden=true})}function showTaskDetail(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const subs=t.subtasks||[];$('detailContent').innerHTML='<div class="detail-kicker">'+esc(t.status||'To Do')+' · '+esc(t.priority||'Medium')+'</div><h1>'+esc(t.title)+'</h1>'+(t.description?'<p class="detail-description">'+esc(t.description)+'</p>':'')+'<div class="detail-grid">'+(t.start?'<div><small>Start date</small><strong>'+dateLabel(t.start,{year:'numeric',month:'long',day:'numeric'})+'</strong></div>':'')+(t.due?'<div><small>Due</small><strong>'+dateLabel(t.due,{year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})+'</strong></div>':'')+(t.folder?'<div><small>Folder</small><strong>'+esc(t.folder)+'</strong></div>':'')+(t.recurrence?'<div><small>Repeat</small><strong>'+esc(t.recurrence)+'</strong></div>':'')+(t.reminder?'<div><small>Reminder</small><strong>'+esc(t.reminder==='at-due'?'At due time':t.reminder+' minutes before')+'</strong></div>':'')+'</div>'+(t.tags?.length?'<h3>Tags</h3><div class="detail-tags">'+t.tags.map(x=>'<span class="pill tag">'+esc(x)+'</span>').join('')+'</div>':'')+(subs.length?'<h3>Checklist</h3><ul>'+subs.map(x=>'<li>'+(x.done?'✓ ':'○ ')+esc(x.text)+'</li>').join('')+'</ul>':'')+(t.attachments?.length?'<h3>Attachments</h3><ul>'+t.attachments.map(x=>'<li>⌁ '+esc(x.name)+'</li>').join('')+'</ul>':'')+(t.notes?'<h3>Notes</h3><p class="detail-description">'+esc(t.notes)+'</p>':'');$('detailPage').classList.add('open');$('detailEdit').onclick=()=>{$('detailPage').classList.remove('open');openTask(id)};$('detailClose').onclick=$('detailBack').onclick=()=>$('detailPage').classList.remove('open')}function showUtility(title,html,onshow){$('utilityTitle').textContent=title;$('utilityBody').innerHTML=html;$('utilityModal').classList.add('open');if(onshow)onshow()}$('utilityClose').onclick=()=>$('utilityModal').classList.remove('open');$('utilityModal').onclick=e=>{if(e.target===$('utilityModal'))$('utilityModal').classList.remove('open')};$('usernameBtn').onclick=()=>showUtility('Your username','<label class="utility-label">Username</label><input id="usernameInput" class="utility-input" maxlength="32"><button class="save-task utility-save" id="saveUsername">Add</button>',()=>{$('usernameInput').value=state.username;$('usernameInput').select();$('saveUsername').onclick=()=>{const value=$('usernameInput').value.trim();if(!value)return toast('Enter a username');state.username=value;save();$('usernameBtn').textContent=value;$('utilityModal').classList.remove('open');toast('Username updated')}});$('addTagBtn').onclick=()=>showUtility('Create tag','<label class="utility-label">Tag name</label><input id="tagName" class="utility-input" placeholder="e.g. Personal"><button class="save-task utility-save" id="saveTag">Create tag</button>',()=>{$('saveTag').onclick=()=>{const name=$('tagName').value.trim();if(!name)return toast('Enter a tag name');if(allTags().some(t=>t.toLowerCase()===name.toLowerCase()))return toast('That tag already exists');state.tags.push(name);save();$('utilityModal').classList.remove('open');render()}});$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('daymark.theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('daymark.theme')==='dark')document.body.classList.add('dark');function checkReminders(){const now=Date.now();let changed=false;state.tasks.forEach(t=>{if(!t.reminder||!t.due||t.status==='Completed'||t.notified)return;const due=new Date(t.due).getTime(),lead=t.reminder==='at-due'?0:Number(t.reminder)*60000;if(due-lead<=now&&due>now-3600000){t.notified=true;changed=true;toast(`Reminder: ${t.title}`)}});if(changed)save()}setInterval(checkReminders,30000);checkReminders();$('sortSelect').value=state.sort||'manual';render();})();
